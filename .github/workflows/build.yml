name: Test & Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name hello_mitul --org com.mitul .

      - run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AAPT dump badging $APK | grep -E "package|sdkVersion|native-code"
          $APKSIGNER verify --verbose $APK
          cp $APK hello-mitul.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hello-mitul-apk
          path: hello-mitul.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hello Mitul build ${{ github.run_number }}
          files: hello-mitul.apk
